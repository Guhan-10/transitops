name: CI and deploy

# Tests run on every pull request and every push to main.
# Deploy runs only on main, and only after every test and build job is green.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Jest + Supertest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: transitops_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Separate, throwaway test database — never the hosted one
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: transitops_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # Repository variable (Settings → Secrets and variables → Actions → Variables)
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # GitHub Pages has no SPA fallback; serving index.html as 404.html makes
      # deep links such as /transitops/vehicles load the app on refresh.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy:
    name: Deploy
    needs: [backend-tests, frontend-build]
    # Push to main, or a manual "Run workflow" on main (e.g. after setting VITE_API_URL)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check deploy configuration
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::Repository variable VITE_API_URL is not set; the frontend will use its localhost fallback."
          fi

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy frontend to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages

      # The backend host's deploy hook URL (e.g. Render → Settings → Deploy Hook).
      # Turn off the host's own auto-deploy so the backend only ships from here, on green.
      - name: Deploy backend
        env:
          BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$BACKEND_DEPLOY_HOOK" ]; then
            echo "::warning::BACKEND_DEPLOY_HOOK secret is not set; backend was not redeployed."
            exit 0
          fi
          curl -fsS -X POST "$BACKEND_DEPLOY_HOOK" > /dev/null
          echo "Backend deploy triggered."
